<!doctype html><html lang="en"><meta charset="utf-8"><title>Oma Edge demo</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#161922;color:#e1e4ed;font:15px Inter,Arial,sans-serif}header{height:58px;display:flex;align-items:center;padding:0 25px;border-bottom:1px solid #2c3040;color:#8e97ac;font-size:12px;letter-spacing:1.4px}.dot{width:8px;height:8px;border-radius:50%;background:#a6dfb3;margin-right:12px}.main{padding:30px}.eyebrow{font-size:11px;letter-spacing:2px;color:#a4b2d1;text-transform:uppercase}h1{font-size:32px;letter-spacing:-1px;margin:16px 0}p{color:#919caf;line-height:1.7}.pill{font-size:11px;color:#a6dfb3;border:1px solid #405948;border-radius:20px;padding:6px 10px}.editor{display:grid;grid-template-columns:180px 1fr;height:calc(100% - 58px)}aside{background:#131620;border-right:1px solid #292d3d;padding:30px 20px;color:#939db2;font-size:13px}aside div{padding:10px 0}.selected{color:#becdf5}.file{padding:18px 26px;background:#1b1e29;border-bottom:1px solid #2c3040;color:#bfcbea;font-size:13px}pre{margin:0;padding:30px 28px;font:17px/1.85 'JetBrains Mono',monospace;color:#d0d7e8}.number{color:#505b72;display:inline-block;width:38px}.purple{color:#c4a4ef}.green{color:#a5d6b0}.blue{color:#91b9ee}.comment{color:#6d7d98}.status{position:absolute;bottom:0;left:0;right:0;height:30px;background:#232b3c;color:#91a8c6;font-size:11px;padding:8px 20px}.note{padding:18px 0;border-bottom:1px solid #2d3343;font-size:14px;line-height:1.7}.check{color:#a6dfb3;margin-right:10px}.album{width:100%;aspect-ratio:1;border-radius:14px;background:radial-gradient(ellipse at 70% 20%,#d6b79255,transparent 55%),radial-gradient(ellipse at 20% 80%,#7398a688,transparent 55%),linear-gradient(150deg,#263941,#101b25);display:grid;place-items:center;margin:22px 0}.record{width:67%;aspect-ratio:1;border-radius:50%;border:1px solid #c1dac133;background:repeating-radial-gradient(circle,#13212b 0px,#13212b 5px,#3a4d51 6px,#13212b 7px);display:grid;place-items:center}.record:after{content:'E';display:grid;place-items:center;wid
